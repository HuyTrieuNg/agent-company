[project]
name = "backend"
version = "0.1.0"
description = "Chatbot backend powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.2",
    "google-genai>=2.9.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.13.2",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "fastembed>=0.8.0",
    "vnstock>=4.0.2",
    "beautifulsoup4==4.12.3",
    "vnstock-ezchart>=0.0.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "E402"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false       # vnstock has no type stubs
reportUnusedFunction = false         # FastAPI routes & helper functions
reportPrivateUsage = false           # backward-compat re-exports layer

